<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexMart — Online Shopping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-muted: #f7f7f8;
      --border: #e5e5e5;
      --text: #111111;
      --text-muted: #6b6b6b;
      --accent: #111111;
      --accent-hover: #333;
      --danger: #c53030;
      --success: #276749;
      --warning: #c05621;
      --radius: 6px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      font-size: 15px;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; }
    img { max-width: 100%; display: block; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 18px; border: 1px solid var(--accent); background: var(--accent);
      color: #fff; border-radius: var(--radius); cursor: pointer; font-weight: 500;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline {
      background: transparent; color: var(--accent);
    }
    .btn-outline:hover { background: var(--bg-muted); }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-danger { background: var(--danger); border-color: var(--danger); }
    .input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: var(--radius); background: #fff;
    }
    .input:focus { outline: none; border-color: #999; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text-muted); }
    .form-group { margin-bottom: 14px; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 12px; font-weight: 500;
    }
    .badge-green { background: #c6f6d5; color: #276749; }
    .badge-red { background: #fed7d7; color: #c53030; }
    .badge-orange { background: #feebc8; color: #c05621; }
    .badge-gray { background: #e2e8f0; color: #4a5568; }

    /* Header */
    .header {
      border-bottom: 1px solid var(--border); background: #fff;
      position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; gap: 16px;
    }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .nav { display: flex; gap: 20px; }
    .nav a { font-size: 14px; font-weight: 500; color: var(--text-muted); }
    .nav a:hover, .nav a.active { color: var(--text); }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      position: relative; background: none; border: none; cursor: pointer;
      padding: 6px; color: var(--text);
    }
    .icon-btn .count {
      position: absolute; top: -2px; right: -4px; background: var(--accent);
      color: #fff; font-size: 10px; min-width: 16px; height: 16px;
      border-radius: 999px; display: flex; align-items: center; justify-content: center;
    }
    .search-box {
      flex: 1; max-width: 360px; position: relative;
    }
    .search-box input { padding-left: 36px; }
    .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #999; }

    /* Product grid */
    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .product-card {
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; background: #fff; transition: box-shadow 0.15s;
    }
    .product-card:hover { box-shadow: var(--shadow); }
    .product-card .img-wrap {
      aspect-ratio: 1; background: var(--bg-muted); overflow: hidden;
    }
    .product-card img { width: 100%; height: 100%; object-fit: cover; }
    .product-card .body { padding: 12px; }
    .product-card .name { font-weight: 500; font-size: 14px; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-card .price { font-weight: 600; }
    .product-card .old-price { text-decoration: line-through; color: var(--text-muted); font-size: 13px; margin-left: 6px; font-weight: 400; }
    .product-card .actions { display: flex; gap: 6px; margin-top: 10px; }

    /* Layout */
    .page { padding: 24px 0 48px; min-height: calc(100vh - 120px); }
    .page-title { font-size: 24px; font-weight: 600; margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    .empty { text-align: center; padding: 48px 16px; color: var(--text-muted); }
    .loading { text-align: center; padding: 48px; color: var(--text-muted); }
    .error-box { background: #fff5f5; border: 1px solid #feb2b2; color: #c53030; padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; }

    /* Product detail */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    @media (max-width: 768px) {
      .detail-grid { grid-template-columns: 1fr; }
      .nav { display: none; }
      .search-box { display: none; }
    }
    .detail-img { aspect-ratio: 1; background: var(--bg-muted); border-radius: var(--radius); overflow: hidden; }
    .detail-img img { width: 100%; height: 100%; object-fit: cover; }
    .variant-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .variant-btn {
      padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius);
      background: #fff; cursor: pointer; font-size: 13px;
    }
    .variant-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }

    /* Cart / Checkout */
    .cart-table { width: 100%; border-collapse: collapse; }
    .cart-table th, .cart-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    .cart-table th { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .qty-control { display: flex; align-items: center; gap: 8px; }
    .qty-control button { width: 28px; height: 28px; border: 1px solid var(--border); background: #fff; border-radius: 4px; cursor: pointer; }

    /* Admin */
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar {
      width: 220px; background: #111; color: #fff; padding: 20px 0; flex-shrink: 0;
    }
    .admin-sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid #333; margin-bottom: 12px; }
    .admin-sidebar a {
      display: block; padding: 10px 20px; color: #aaa; font-size: 14px;
    }
    .admin-sidebar a:hover, .admin-sidebar a.active { color: #fff; background: #222; }
    .admin-main { flex: 1; background: var(--bg-muted); }
    .admin-header {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
    }
    .admin-content { padding: 24px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px;
    }
    .stat-card .label { font-size: 13px; color: var(--text-muted); }
    .stat-card .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
    .data-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .data-table th, .data-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    .data-table th { background: var(--bg-muted); font-weight: 500; font-size: 13px; color: var(--text-muted); }
    .data-table tr:last-child td { border-bottom: none; }

    .footer {
      border-top: 1px solid var(--border); padding: 24px 0; text-align: center;
      color: var(--text-muted); font-size: 13px;
    }
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tabs button {
      padding: 10px 16px; border: none; background: none; cursor: pointer;
      font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent;
    }
    .tabs button.active { color: var(--text); border-bottom-color: var(--text); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <script type="text/babel" src="/app.js"></script>
</body>
</html>
